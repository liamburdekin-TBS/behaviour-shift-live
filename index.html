.progress-shell{height:3px;background:rgba(247,240,230,.10);margin-top:22px;overflow:hidden;border-radius:4px}.progress{height:100%;width:0;background:var(--gold);transition:width .28s ease}.question{margin-top:22px;font-size:clamp(20px,5.7vw,25px);line-height:1.27;font-weight:850}.answer-grid{display:grid;gap:8px;margin-top:16px}.answer{text-align:left;width:100%;border:1px solid rgba(215,168,74,.28);background:rgba(255,255,255,.035);color:var(--cream);border-radius:17px;padding:12px 13px;font-size:13.5px;line-height:1.38;transition:transform .16s ease,background .16s ease,border-color .16s ease}.answer:active{transform:scale(.985);background:rgba(215,168,74,.08);border-color:rgba(215,168,74,.5)}

.transition-screen{
  justify-content:center;
  overflow:hidden!important;
  overscroll-behavior:none;
  touch-action:none;
  text-align:left;
}
.transition-screen .kicker{margin-top:0}
.transition-title{
  margin-top:10px;
  font-size:clamp(34px,10.5vw,58px);
  line-height:.95;
  letter-spacing:-1.4px;
  text-transform:uppercase;
}
.transition-copy{
  margin-top:14px;
  max-width:520px;
  color:var(--soft);
  font-size:14px;
  line-height:1.45;
}
.transition-rule{
  position:relative;
  width:min(310px,72vw);
  height:3px;
  margin:25px 0 15px;
  overflow:hidden;
  border-radius:999px;
  background:linear-gradient(90deg,var(--gold),rgba(215,168,74,.15));
  box-shadow:0 0 12px rgba(215,168,74,.52),0 0 28px rgba(215,168,74,.2);
}
.transition-rule::after{
  content:"";
  position:absolute;
  inset:-5px auto -5px -62%;
  width:64%;
  background:linear-gradient(90deg,transparent,rgba(255,232,156,.34),rgba(255,250,226,.96),#fff,rgba(255,221,118,.8),transparent);
  filter:blur(.2px) drop-shadow(0 0 7px rgba(255,235,165,.86));
  animation:transitionSweep 1.65s ease-in-out infinite;
}
@keyframes transitionSweep{
  0%,8%{transform:translate3d(0,0,0) skewX(-18deg);opacity:0}
  18%{opacity:1}
  68%{transform:translate3d(275%,0,0) skewX(-18deg);opacity:1}
  82%,100%{transform:translate3d(275%,0,0) skewX(-18deg);opacity:0}
}
.transition-dots{
  display:flex;
  gap:7px;
  margin-top:6px;
}
.transition-dots span{
  width:6px;height:6px;border-radius:50%;
  background:rgba(215,168,74,.28);
  animation:transitionDot 1.1s ease-in-out infinite;
}
.transition-dots span:nth-child(2){animation-delay:.14s}
.transition-dots span:nth-child(3){animation-delay:.28s}
@keyframes transitionDot{
  0%,100%{transform:scale(.72);opacity:.35}
  50%{transform:scale(1);opacity:1;background:var(--gold)}
}
.answer.is-selected{
  background:linear-gradient(135deg,rgba(215,168,74,.26),rgba(215,168,74,.09));
  border-color:var(--gold);
  color:var(--cream);
  box-shadow:0 0 0 1px rgba(215,168,74,.12),0 10px 28px rgba(0,0,0,.18),0 0 22px rgba(215,168,74,.12);
  transform:scale(.985);
  transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,transform .16s ease,opacity .18s ease;
}
.answer.is-selected strong{color:var(--gold)}
.answer.is-dimmed{opacity:.45}
.answer:disabled{cursor:default}

function isTextEntryFocused(){
  const el=document.activeElement;
  return el instanceof Element && Boolean(el.closest('textarea,input,select,[contenteditable="true"]'));
}
function setStableAppHeight(){
  if(isTextEntryFocused()) return;
  const h=Math.max(320,Math.round(window.innerHeight||document.documentElement.clientHeight||0));
  document.documentElement.style.setProperty('--bs-app-height',h+'px');
}
setStableAppHeight();
window.addEventListener('resize',()=>requestAnimationFrame(setStableAppHeight),{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(setStableAppHeight,180),{passive:true});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',()=>{
    if(!isTextEntryFocused()) requestAnimationFrame(setStableAppHeight);
  },{passive:true});
}
document.addEventListener('focusout',()=>setTimeout(setStableAppHeight,120),true);

const QUESTIONS=[["A young person has ignored the same reasonable instruction three times. Other staff are watching. What do you instinctively do next?", [["Restate the boundary clearly and hold it.", {"controller": 3, "regulator": 1}], ["Ask what is getting in the way first.", {"rescuer": 3, "regulator": 1}], ["Lower my intensity and choose the next useful step.", {"regulator": 3, "withdrawer": 1}], ["Give it space and come back to it shortly.", {"withdrawer": 3, "regulator": 1}], ["Work out a practical way to get the task done.", {"problem": 3, "controller": 1}], ["Address the challenge directly so it does not grow.", {"reactor": 3, "controller": 1}]]], ["A young person has self-harmed. Immediate medical and safeguarding actions are underway. In the relational moment afterwards, where do you naturally go?", [["Stay steady, present and let them set the pace.", {"regulator": 3, "rescuer": 1}], ["Reassure them strongly that they are not alone.", {"rescuer": 3, "regulator": 1}], ["Gently explore what happened beforehand.", {"problem": 3, "rescuer": 1}], ["Make sure they understand how seriously I take it.", {"reactor": 3, "rescuer": 1}], ["Create some breathing room and reconnect when ready.", {"withdrawer": 3, "regulator": 1}], ["Bring calm structure to what needs to happen next.", {"controller": 3, "problem": 1}]]], ["A young person returns from family time withdrawn, refuses to talk, then snaps at you over something minor. What is your instinct?", [["Stay curious about what changed for them.", {"regulator": 3, "rescuer": 1}], ["Acknowledge the feeling but keep expectations clear.", {"controller": 3, "regulator": 1}], ["Create another chance for them to open up.", {"rescuer": 3, "regulator": 1}], ["Give them space without chasing the conversation.", {"withdrawer": 3, "regulator": 1}], ["Think through what may have happened and what could help.", {"problem": 3, "rescuer": 1}], ["Respond firmly to the snap before it escalates.", {"reactor": 3, "controller": 1}]]], ["After a physical intervention, a young person says, ‘You put your hands on me. I don't trust you anymore.’ What do you do first?", [["Stay with how it felt for them before explaining.", {"regulator": 3, "rescuer": 1}], ["Reassure them that the relationship still matters to me.", {"rescuer": 3, "regulator": 1}], ["Explain clearly why staff acted to keep people safe.", {"problem": 3, "controller": 1}], ["Acknowledge it, give space, then return to repair.", {"withdrawer": 3, "regulator": 1}], ["Make sure the facts and boundaries around what happened are clear.", {"controller": 3, "problem": 1}], ["Defend the seriousness of the decision because it mattered.", {"reactor": 3, "controller": 1}]]], ["A young person is missing from care. Procedures are underway and concern is rising. What happens to you under that pressure?", [["I become very structured about roles and actions.", {"controller": 3, "problem": 1}], ["I keep doing something — calls, checks, updates.", {"reactor": 3, "problem": 1}], ["I focus hard on information and practical next steps.", {"problem": 3, "controller": 1}], ["I keep bringing myself back to what we actually know.", {"regulator": 3, "problem": 1}], ["I focus on keeping everyone emotionally supported too.", {"rescuer": 3, "regulator": 1}], ["I step back from the noise so I can think clearly.", {"withdrawer": 3, "regulator": 1}]]], ["A young person swears at you and calls you useless in front of colleagues. You feel embarrassed and angry. What is your instinct?", [["Address the disrespect briefly and firmly.", {"controller": 3, "reactor": 1}], ["Stay steady and return to the disrespect later.", {"regulator": 3, "withdrawer": 1}], ["Let some of my firmness and emotion show.", {"reactor": 3, "controller": 1}], ["Step back so I do not respond from embarrassment.", {"withdrawer": 3, "regulator": 1}], ["Try to understand what triggered the attack on me.", {"rescuer": 3, "regulator": 1}], ["Move the situation towards a practical resolution.", {"problem": 3, "controller": 1}]]], ["A young person deliberately damages something after being told no, then looks at you waiting for your reaction. What do you naturally do?", [["State the limit and what needs to happen next.", {"controller": 3, "problem": 1}], ["Make clear that this has crossed a serious line.", {"reactor": 3, "controller": 1}], ["Secure the area and sort the practical consequences.", {"problem": 3, "controller": 1}], ["Keep connection while making clear it cannot be ignored.", {"rescuer": 3, "controller": 1}], ["Slow myself down so their reaction does not set mine.", {"regulator": 3, "withdrawer": 1}], ["Reduce the interaction and give the moment space.", {"withdrawer": 3, "regulator": 1}]]], ["Near the end of a difficult shift, a young person refuses the bedtime routine and argues over every request. What do you want to do?", [["Keep the routine clear and consistent.", {"controller": 3, "regulator": 1}], ["Find a workable compromise that still gets things done.", {"problem": 3, "rescuer": 1}], ["Reduce the back-and-forth and try again shortly.", {"withdrawer": 3, "regulator": 1}], ["Notice my tiredness and deliberately slow down.", {"regulator": 3, "withdrawer": 1}], ["Soften the approach and reconnect before pushing again.", {"rescuer": 3, "regulator": 1}], ["Deal with the challenge directly so it does not take over.", {"reactor": 3, "controller": 1}]]], ["A colleague says in front of a young person that your approach is making things worse. What is your first instinct?", [["Respond there and then so I am not undermined.", {"reactor": 3, "controller": 1}], ["Let them lead briefly, then address it privately.", {"withdrawer": 3, "regulator": 1}], ["Smooth the moment so the room does not split.", {"rescuer": 3, "regulator": 1}], ["Deal with the immediate situation and solve the disagreement later.", {"problem": 3, "controller": 1}], ["Keep the team boundary clear without arguing in front of the young person.", {"controller": 3, "regulator": 1}], ["Stay composed and choose whichever response lowers pressure most.", {"regulator": 3, "withdrawer": 1}]]], ["After an incident you try to repair. The young person says, ‘Leave me alone. I don't want your fake apology.’ What do you do?", [["Respect the space and make sure I return later.", {"withdrawer": 3, "regulator": 1}], ["Make clear that I genuinely care and mean the apology.", {"rescuer": 3, "regulator": 1}], ["Clarify what I am apologising for and what still matters.", {"controller": 3, "problem": 1}], ["Suggest a practical way to revisit the conversation later.", {"problem": 3, "withdrawer": 1}], ["Accept the reaction without becoming defensive and stay available.", {"regulator": 3, "rescuer": 1}], ["Push back a little because I need them to know I am being genuine.", {"reactor": 3, "rescuer": 1}]]]];
const PROFILES={"controller": {"name": "THE CONTROLLER", "bring": "You bring clarity, decisiveness, consistency and structure. When a room becomes uncertain, you can help people know what matters, what happens next and where the boundary sits.", "power": "Clear expectations • Confident boundaries • Decisive action • Consistency • Leadership in uncertainty • Ability to create order when others hesitate", "child_positive": "“They make things clear. I know where I stand, and when things feel chaotic they can make the situation feel held.”", "pressure": "When you are under pressure, be mindful of becoming so focused on clarity and structure that there is less room for curiosity.", "shift": "KEEP THE CLARITY. KEEP THE BOUNDARY. LEAVE ROOM FOR CURIOSITY.", "reflection": "When you feel yourself becoming firmer, what would help you keep the useful structure without turning the interaction into a contest?"}, "rescuer": {"name": "THE RESCUER", "bring": "You bring warmth, empathy, responsiveness and a strong relational instinct. You often notice distress quickly and can make young people feel cared for, accompanied and worth staying with.", "power": "Relationship building • Reassurance • Emotional availability • Spotting distress • Repair • Compassion • Persistence with connection", "child_positive": "“They notice when I am struggling. They make it easier to believe that somebody is actually on my side.”", "pressure": "When you are under pressure, be mindful of stepping in so quickly that support starts doing too much for the young person.", "shift": "KEEP THE WARMTH. SUPPORT WITHOUT TAKING OVER.", "reflection": "How can you stay deeply caring while still leaving enough space for the young person to discover what they can manage themselves?"}, "reactor": {"name": "THE REACTOR", "bring": "You bring energy, passion, courage and visible emotional investment. You are often willing to act, challenge, protect and show that something genuinely matters rather than standing back from it.", "power": "Energy • Courage • Protective instinct • Fast response • Passion • Willingness to challenge • Visible care and emotional investment", "child_positive": "“I can tell they care. They do not act like what happens to me means nothing, and they are willing to step in when it matters.”", "pressure": "When you are under pressure, be mindful of giving yourself enough pause to choose your tone, pace and response before the room chooses them for you.", "shift": "KEEP THE PASSION. LET EMOTION INFORM THE RESPONSE — NOT DRIVE IT.", "reflection": "What helps you keep the energy and courage that make you useful while slowing the ten seconds in which the room can start setting your pace?"}, "withdrawer": {"name": "THE BREATHER", "bring": "You bring calm, restraint, patience and an instinct to create breathing space when an interaction is becoming overloaded. You can tolerate silence, reduce unnecessary pressure and give people room to process without chasing them.", "power": "De-escalation • Creating breathing space • Tolerance of silence • Patience • Not feeding conflict • Knowing when not to push • Reducing emotional heat", "child_positive": "“They do not chase me or make every moment bigger. Sometimes the breathing space they give me is exactly what helps me come back.”", "pressure": "Be mindful of making sure the breathing space has a purpose and that important conversations are returned to when the moment is right.", "shift": "KEEP THE SPACE. MAKE SURE YOU COME BACK.", "reflection": "What tells you that the space you are creating is helping the young person regulate — and what will remind you to return when the moment is ready?"}, "problem": {"name": "THE PROBLEM SOLVER", "bring": "You bring logic, organisation, resourcefulness and practical thinking. When situations become messy, you can break complexity down, identify options and create a workable route forward.", "power": "Organisation • Practical thinking • Planning • Resourcefulness • Problem solving • Making complexity manageable • Turning uncertainty into action", "child_positive": "“They can help when everything feels like a mess. They usually have a way forward and can make problems feel more manageable.”", "pressure": "When you are under pressure, be mindful of understanding what the situation means to the young person before moving too quickly into solving it.", "shift": "KEEP THE SOLUTIONS. UNDERSTAND BEFORE YOU ENGINEER THE EXIT.", "reflection": "What would change if understanding the emotional problem became the first part of your practical solution rather than something you return to afterwards?"}, "regulator": {"name": "THE REGULATOR", "bring": "You bring steadiness, observation, patience and emotional containment. You can reduce heat, hold uncertainty and manage your own state when other people are struggling to manage theirs.", "power": "Calm under pressure • Observation • Patience • Emotional containment • Reduced escalation • Thoughtful decision-making • Lending steadiness to others", "child_positive": "“They stay steady when I cannot. They do not add another problem to the room, and that can make it easier for me to settle.”", "pressure": "When you are under pressure, be mindful of making sure your calm still feels connected and that you act clearly when the moment needs it.", "shift": "KEEP THE STEADINESS. STAY HUMAN. ACT WHEN ACTION IS NEEDED.", "reflection": "How can your calm continue to feel like presence and support — not distance — while still allowing you to act decisively when the moment requires it?"}};

function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function sectionData(n){const x=SECTIONS.find(s=>s[0]===n)||SECTIONS[0];return {eyebrow:x[1],name:x[2],title:x[3]}}
function shell(inner,extra=''){return `<section class="screen ${extra}"><div class="brand">Behaviour Shift Live</div><div class="logo">THE <b>BEHAVIOUR SHIFT™</b></div>${inner}</section>`}
function holdScreen(item){const s=sectionData(item.section);return shell(`<div class="kicker">${esc(item.label||s.eyebrow)} · PARTICIPANT VIEW</div><h1 class="hold-title">${esc(item.title||s.name)}</h1><div class="gold-rule"></div><div class="waiting-pill"><span class="dot"></span> Live session</div><p class="hold-copy">${esc(item.subtitle||s.title)}<br><br>Stay with the room. Your phone will change when the facilitator opens the next activity.</p>`,'hold')}
function wallScreen(item){const w=item.wall,e=savedWalls.get(w.id)||{text:'',sent:false,ready:false};return shell(`<div class="kicker">${esc(w.kicker||'Shared Wall')} · Anonymous</div><h1>${w.title}</h1>${w.lead?`<p class="lead">${esc(w.lead)}</p>`:''}<div class="card"><textarea id="wallInput" placeholder="${esc(w.placeholder)}">${esc(e.text)}</textarea><div class="actions"><button class="btn primary ${e.sent?'sent':''}" id="sendWall" ${e.sent?'disabled':''}>${e.sent?'✓ Sent':'Send →'}</button><button class="btn ${e.ready?'ready-green':''}" id="readyWall" ${e.sent?'':'disabled'}>${e.ready?'✓ Ready':'Ready up'}</button></div><div class="status ${e.ready?'ready':''}" id="wallStatus">${e.ready?'You’re ready. Stay with the room.':e.sent?'Response sent. Ready up when you’re done.':'Your response is anonymous in this prototype demo.'}</div></div><p class="prototype-note">Prototype participant view · No response leaves this device.</p>`)}
function transitionScreen(nextItem){
  const nextSection=sectionData(nextItem?.section ?? 0);
  let eyebrow='Behaviour Shift Live';
  let title='STAY WITH THE ROOM.';
  let copy='Bringing the next part of the session to your phone.';

  if(nextItem?.type==='wall'){
    eyebrow='Shared Wall · Opening';
    title='YOUR TURN.';
    copy='The next room question is opening.';
  }else if(nextItem?.type==='wall-revealed'){
    eyebrow='Shared Wall · Revealing';
    title='BRINGING THE ROOM TOGETHER.';
    copy='The facilitator is revealing the room’s responses.';
  }else if(nextItem?.type==='pressure'){
    eyebrow='Behaviour Lens™ · Pressure Profile™';
    title='TURN THE LENS AROUND.';
    copy='Preparing your private Pressure Profile activity.';
  }else if(nextItem?.type==='shift'){
    eyebrow='Reflection';
    title='MAKE THE SHIFT YOURS.';
    copy='Opening your private reflection.';
  }else if(nextItem?.type==='feedback'){
    eyebrow='Feedback';
    title='HELP US SHIFT TOO.';
    copy='Opening the final participant feedback.';
  }else if(nextItem?.type==='hold' || nextItem?.type==='agreement'){
    eyebrow=nextItem?.type==='agreement'?'Room agreement':nextSection.eyebrow;
    title=nextItem?.type==='agreement'?'SETTING THE ROOM.':nextSection.name;
    copy=nextItem?.type==='agreement'?'A few foundations before the first room interaction.':nextSection.title;
  }else if(nextItem?.type==='end'){
    eyebrow='Behaviour Shift Live';
    title='SESSION COMPLETE.';
    copy='Closing the participant experience.';
  }

  return shell(`
    <div class="kicker">${esc(eyebrow)}</div>
    <div class="transition-title">${esc(title)}</div>
    <div class="transition-rule"></div>
    <div class="transition-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="transition-copy">${esc(copy)}</p>
  `,'transition-screen');
}

function pressureAnalysis(){return shell(`<div class="analysis"><div class="kicker">Behaviour Lens™</div><h1>ANALYSING YOUR<br><span class="gold">PRESSURE PROFILE.</span></h1><div class="gold-rule"></div><p class="lead">Looking for the pattern across your responses.</p></div>`)}
function profileResult(){const keys=Object.keys(pressureState.scores).sort((a,b)=>pressureState.scores[b]-pressureState.scores[a]),key=keys[0],second=keys[1],p=PROFILES[key]||{},p2=PROFILES[second]||{},name=(p.name||key).toUpperCase().replace(/^THE\s+/i,''),sec=(p2.name||second).toUpperCase().replace(/^THE\s+/i,'');return shell(`<div class="kicker">Behaviour Lens™ · Your Pressure Profile</div><h1 class="result-name">THE ${esc(name)}</h1><p class="lead" style="margin-top:10px">Strong secondary tendency · <strong>${esc(sec)}</strong></p><div class="result-grid"><div class="result-card sage"><b>What you bring</b><p>${esc(p.bring||'Useful strengths you naturally bring into the room.')}</p></div><div class="result-card sage"><b>Where this profile is powerful</b><p>${esc(p.power||'Your strengths can become particularly useful when pressure rises.')}</p></div><div class="result-card sage"><b>What a young person may value</b><p>${esc(p.young||'How your strengths may be experienced by a young person.')}</p></div><div class="result-card"><b>What to be mindful of</b><p>${esc(p.pressure||'Keep noticing how your strengths change when pressure goes up.')}</p></div></div><div class="takeaway">YOUR BEHAVIOUR SHIFT · ${esc(p.shift||'KEEP THE STRENGTH. USE IT WITH INTENTION.')}</div>${p.reflection?`<p class="lead" style="font-size:14px">${esc(p.reflection)}</p>`:''}<div class="actions"><button class="btn" id="retakePressure">Retake assessment</button><button class="btn primary" id="continuePressure">Continue →</button></div>`)}
function shiftScreen(){return shell(`<div class="kicker">Reflection · Private by default</div><h1>YOUR<br><span class="gold">BEHAVIOUR SHIFT.</span></h1><p class="lead">Capture what you want to take back into practice.</p><div class="card"><label class="field-label">Something I will notice</label><textarea placeholder="What will you notice sooner?"></textarea><label class="field-label">Something I will manage</label><textarea placeholder="What will you manage differently in yourself?"></textarea><label class="field-label">Something I will stop</label><textarea placeholder="What will you stop doing?"></textarea><label class="field-label">Something I will start</label><textarea placeholder="What will you start doing?"></textarea><button class="btn primary" id="saveShift" style="margin-top:12px">Save my shift →</button><div class="status" id="shiftStatus">Prototype: saved only on this device.</div></div>`)}
function ratingButtons(){return [1,2,3,4,5].map(n=>`<button data-value="${n}">${n}</button>`).join('')}
function feedbackScreen(){return shell(`<div class="kicker">Feedback · Help us shift too</div><h1>HELP US<br><span class="gold">IMPROVE THE WORK.</span></h1><p class="lead">A lightweight participant feedback view for the prototype.</p><div class="card"><label class="field-label">How useful was this session?</label><div class="rating">${ratingButtons()}</div><label class="field-label">How confident do you feel applying it?</label><div class="rating">${ratingButtons()}</div><label class="field-label">What changed or challenged your thinking?</label><textarea placeholder="Your response..."></textarea><button class="btn primary" id="sendFeedback" style="margin-top:12px">Send feedback →</button><div class="status" id="feedbackStatus">Anonymous prototype feedback · stored nowhere.</div></div>`)}
function endScreen(){return shell(`<div class="kicker">Prototype complete</div><h1>THE<br><span class="gold">BEHAVIOUR SHIFT™</span></h1><div class="gold-rule"></div><p class="lead">This is the participant-phone vision: section snapshots when listening, interactions only when the room needs them.</p><button class="btn" id="restartDemo" style="margin-top:18px;width:max-content">Restart prototype</button>`,'hold')}
function currentMarkup(){
  const item=FLOW[current];
  if(item.type==='hold')return holdScreen(item);
  if(item.type==='agreement')return agreementScreen();
  if(item.type==='wall')return wallScreen(item);
  if(item.type==='wall-revealed')return wallRevealedScreen(item);
  if(item.type==='pressure')return pressureState.index<0?pressureIntro():pressureQuestion();
  if(item.type==='shift')return shiftScreen();
  if(item.type==='feedback')return feedbackScreen();
  if(item.type==='end')return endScreen();
  return holdScreen({section:0});
}
function stripGhostIds(node){
  node.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));
  node.querySelectorAll('textarea,input,button,a,select').forEach(el=>{el.tabIndex=-1;el.setAttribute('aria-hidden','true')});
}
function render(animate=false,direction=1){
  const existing=app.querySelector('.screen.active');
  let ghost=null;
  if(animate && existing){
    ghost=existing.cloneNode(true);
    stripGhostIds(ghost);
    ghost.classList.add('motion-ghost','active');
  }

  app.innerHTML=currentMarkup();
  const incoming=app.querySelector('.screen');
  if(!incoming)return;

  if(ghost){
    app.prepend(ghost);
    incoming.classList.add(direction>0?'after':'before');
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      ghost.classList.remove('active');
      ghost.classList.add(direction>0?'before':'after');
      incoming.classList.remove('before','after');
      incoming.classList.add('active');
    }));
    setTimeout(()=>ghost.remove(),460);
  }else{
    incoming.classList.add('active');
  }

  incoming.scrollTop=0;
  setStableAppHeight();
  bindCurrent();
}
function bindCurrent(){const item=FLOW[current];if(item.type==='wall'){const w=item.wall,input=document.getElementById('wallInput');document.getElementById('sendWall')?.addEventListener('click',()=>{const text=input.value.trim();if(!text){document.getElementById('wallStatus').textContent='Write a response first.';return}savedWalls.set(w.id,{text,sent:true,ready:false});render()});document.getElementById('readyWall')?.addEventListener('click',()=>{const e=savedWalls.get(w.id)||{text:input.value.trim(),sent:true,ready:false};e.ready=!e.ready;savedWalls.set(w.id,e);render()})}
if(item.type==='pressure'){
  document.getElementById('beginPressure')?.addEventListener('click',()=>{
    pressureState.index=0;
    render(true,1);
  });
  document.querySelectorAll('[data-answer]').forEach(btn=>btn.addEventListener('click',()=>{
    if(pressureAdvanceTimer)return;
    const buttons=[...document.querySelectorAll('[data-answer]')];
    buttons.forEach(b=>{b.disabled=true;if(b!==btn)b.classList.add('is-dimmed')});
    btn.classList.add('is-selected');

    const q=QUESTIONS[pressureState.index];
    const pick=q[1][Number(btn.dataset.answer)];
    Object.entries(pick[1]).forEach(([k,v])=>pressureState.scores[k]=(pressureState.scores[k]||0)+v);
    pressureState.answers.push(Number(btn.dataset.answer));

    pressureAdvanceTimer=setTimeout(()=>{
      pressureAdvanceTimer=null;
      if(pressureState.index<QUESTIONS.length-1){
        pressureState.index++;
        render(true,1);
      }else{
        app.innerHTML=pressureAnalysis();
        app.querySelector('.screen')?.classList.add('active');
        setTimeout(()=>{
          app.innerHTML=profileResult();
          app.querySelector('.screen')?.classList.add('active');
          bindResult();
        },5000);
      }
    },950);
  }));
}
if(item.type==='shift')document.getElementById('saveShift')?.addEventListener('click',()=>{const b=document.getElementById('saveShift');b.textContent='✓ Saved';b.classList.add('sent');document.getElementById('shiftStatus').textContent='Saved privately on this device for the prototype.'})
if(item.type==='feedback'){document.querySelectorAll('.rating button').forEach(btn=>btn.addEventListener('click',()=>{const row=btn.parentElement;row.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected')}));document.getElementById('sendFeedback')?.addEventListener('click',()=>{const rows=[...document.querySelectorAll('.rating')];if(rows.some(r=>!r.querySelector('.selected'))){document.getElementById('feedbackStatus').textContent='Choose both ratings first.';return}const b=document.getElementById('sendFeedback');b.textContent='✓ Feedback sent';b.classList.add('sent');b.disabled=true;document.getElementById('feedbackStatus').textContent='Thank you · prototype acknowledgement only.'})}
document.getElementById('restartDemo')?.addEventListener('click',()=>{clearTransitionTimer();transitionToken++;if(pressureAdvanceTimer){clearTimeout(pressureAdvanceTimer);pressureAdvanceTimer=null}current=0;pressureState={index:-1,scores:{controller:0,rescuer:0,reactor:0,withdrawer:0,problem:0,regulator:0},answers:[]};savedWalls.clear();render()})}
function bindResult(){document.getElementById('retakePressure')?.addEventListener('click',()=>{if(pressureAdvanceTimer){clearTimeout(pressureAdvanceTimer);pressureAdvanceTimer=null}pressureState={index:-1,scores:{controller:0,rescuer:0,reactor:0,withdrawer:0,problem:0,regulator:0},answers:[]};render()});document.getElementById('continuePressure')?.addEventListener('click',next)}
function clearTransitionTimer(){
  if(transitionTimer){
    clearTimeout(transitionTimer);
    transitionTimer=null;
  }
}
function navigateWithTransition(target,direction=1){
  if(target<0 || target>=FLOW.length || target===current)return;
  clearTransitionTimer();
  const token=++transitionToken;
  const existing=app.querySelector('.screen.active');
  let ghost=null;
  if(existing){
    ghost=existing.cloneNode(true);
    stripGhostIds(ghost);
    ghost.classList.add('motion-ghost','active');
  }
  app.innerHTML=transitionScreen(FLOW[target]);
  const loading=app.querySelector('.screen');
  if(!loading)return;
  if(ghost){
    app.prepend(ghost);
    loading.classList.add(direction>0?'after':'before');
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      ghost.classList.remove('active');
      ghost.classList.add(direction>0?'before':'after');
      loading.classList.remove('before','after');
      loading.classList.add('active');
    }));
    setTimeout(()=>ghost.remove(),460);
  }else{
    loading.classList.add('active');
  }
  transitionTimer=setTimeout(()=>{
    transitionTimer=null;
    if(token!==transitionToken)return;
    current=target;
    render(true,direction);
  },760);
}
function next(){if(current<FLOW.length-1)navigateWithTransition(current+1,1)}
function prev(){if(current>0)navigateWithTransition(current-1,-1)}
let gesture=null,swipeLocked=false,suppressGestureClickUntil=0;
function clearGesture(){gesture=null}
function isTextOrControl(target){
  return target instanceof Element && Boolean(target.closest('textarea,button,input,select,label,a,[contenteditable="true"]'));
}
function getPhoneScrollSurface(target){
  const screen=target instanceof Element?target.closest('.screen.active'):null;
  if(!screen)return null;
  return screen.scrollHeight>screen.clientHeight+6?screen:null;
}
app.addEventListener('touchstart',event=>{
  if(event.touches.length!==1 || transitionTimer || isTextOrControl(event.target)){gesture=null;return}
  const t=event.touches[0];
  const screen=event.target.closest('.screen.active');
  const scrollSurface=getPhoneScrollSurface(event.target);
  const maxScroll=scrollSurface?Math.max(0,scrollSurface.scrollHeight-scrollSurface.clientHeight):0;
  const top=scrollSurface?scrollSurface.scrollTop:0;
  gesture={
    x:t.clientX,y:t.clientY,startedAt:performance.now(),screen,scrollSurface,
    startedAtTop:!scrollSurface||top<=5,
    startedAtBottom:!scrollSurface||top>=maxScroll-5,
    moved:false
  };
},{passive:true,capture:true});

app.addEventListener('touchmove',event=>{
  if(!gesture || event.touches.length!==1)return;
  const t=event.touches[0];
  if(Math.abs(t.clientY-gesture.y)>14 || Math.abs(t.clientX-gesture.x)>14)gesture.moved=true;
},{passive:true,capture:true});

app.addEventListener('touchend',event=>{
  if(!gesture || swipeLocked)return;
  const g=gesture;gesture=null;
  if(!g.moved || !event.changedTouches.length)return;
  const end=event.changedTouches[0];
  const dx=end.clientX-g.x,dy=end.clientY-g.y;
  const distance=Math.abs(dy);
  const duration=Math.max(1,performance.now()-g.startedAt);
  const velocity=distance/duration;
  if(distance<=Math.abs(dx)*1.35)return;

  const direction=dy<0?1:-1;
  const fastFlick=distance>=68 && duration<=300 && velocity>=.42;
  let shouldNavigate=false;

  if(g.scrollSurface){
    const startedAtDirectionEdge=direction>0?g.startedAtBottom:g.startedAtTop;
    shouldNavigate=startedAtDirectionEdge && (fastFlick || (distance>=104 && duration<=650 && velocity>=.25));
  }else{
    shouldNavigate=fastFlick || (distance>=108 && duration<=650 && velocity>=.28);
  }

  if(shouldNavigate){
    swipeLocked=true;
    suppressGestureClickUntil=performance.now()+500;
    direction>0?next():prev();
    setTimeout(()=>{swipeLocked=false},440);
  }else{
    swipeLocked=false;
  }
},{passive:true,capture:true});
app.addEventListener('touchcancel',clearGesture,{passive:true,capture:true});

document.addEventListener('click',event=>{
  if(performance.now()<suppressGestureClickUntil && !isTextOrControl(event.target)){
    event.preventDefault();
    event.stopImmediatePropagation();
  }
},true);

render();
</script>
</body>
</html>
